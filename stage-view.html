<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柴烧窑器制作步骤 - 云端等开窑</title>
  <style>
    :root {
      --bg: #1a1613;
      --panel: rgba(45, 38, 32, 0.9);
      --panel-light: rgba(60, 48, 38, 0.8);
      --text: #f5ebe0;
      --muted: #9a8f80;
      --primary: #c47d4c;
      --accent: #e89649;
      --fire: #d45a29;
      --soil: #5c4a3a;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(196, 125, 76, 0.1), transparent 35%),
        radial-gradient(circle at 82% 4%, rgba(232, 150, 73, 0.06), transparent 30%),
        linear-gradient(145deg, #1a1613 0%, #251f1a 48%, #1f1a16 100%);
    }
    .page {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .topbar button {
      border: 0;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.15s ease;
    }
    .topbar button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .hero-section {
      padding: 24px 32px;
      border-radius: var(--radius);
      background: var(--panel-light);
      border: 1px solid rgba(196, 125, 76, 0.15);
      margin-bottom: 24px;
    }
    .hero-section h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #f5ebe0;
    }
    .hero-section p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-header h2 {
      margin: 0;
      font-size: 20px;
      color: #f5ebe0;
    }
    .section-header .note {
      font-size: 13px;
      color: var(--muted);
    }
    .kiln-card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }
    .kiln-card:hover {
      border-color: rgba(196, 125, 76, 0.25);
    }
    .kiln-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .kiln-title {
      display: flex;
      flex-direction: column;
    }
    .kiln-title h3 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #f5ebe0;
    }
    .kiln-title .sub-name {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .kiln-title .desc {
      font-size: 13px;
      color: var(--muted);
    }
    .kiln-difficulty {
      font-size: 18px;
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .step-card {
      background: rgba(60, 48, 38, 0.6);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .step-card:hover {
      border-color: rgba(196, 125, 76, 0.2);
      transform: translateY(-2px);
    }
    .step-canvas {
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, #2d251f 0%, #251f1a 100%);
    }
    .step-canvas canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .step-info {
      padding: 10px 12px;
      text-align: center;
    }
    .step-info .step-num {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .step-info .step-name {
      font-size: 13px;
      color: #f5ebe0;
    }
    .detail-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      padding: 24px;
      overflow-y: auto;
    }
    .detail-modal.active {
      display: block;
    }
    .detail-header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-header h2 {
      margin: 0;
      font-size: 28px;
      color: #f5ebe0;
    }
    .close-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .detail-steps {
      max-width: 900px;
      margin: 0 auto;
    }
    .detail-step {
      display: flex;
      gap: 20px;
      padding: 20px;
      background: var(--panel);
      border-radius: var(--radius);
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .detail-step .step-num {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #a36235);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(196, 125, 76, 0.3);
    }
    .detail-step .step-canvas {
      flex-shrink: 0;
      width: 160px;
      height: 160px;
      border-radius: 12px;
    }
    .detail-step .step-text {
      flex: 1;
      padding-top: 4px;
    }
    .detail-step .step-text h4 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #f5ebe0;
    }
    .detail-step .step-text p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }
    @media (max-width: 1024px) {
      .steps-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 768px) {
      .steps-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .detail-step {
        flex-direction: column;
      }
      .detail-step .step-canvas {
        width: 100%;
        height: 180px;
      }
      .detail-header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }
    @media (max-width: 480px) {
      .steps-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

    var shapeMap = {
      1: 'cup',
      2: 'gongdao',
      3: 'gaiwan',
      4: 'caddy',
      5: 'vase',
      6: 'meiping',
      7: 'teapot',
      8: 'censer',
      9: 'jianzhan',
      10: 'vat'
    };

    function drawKiln(ctx, cx, cy) {
      var fireColor = '#d45a29';
      var glowColor = '#e89649';
      ctx.fillStyle = '#2d251f';
      ctx.beginPath();
      ctx.moveTo(cx - 50, cy + 30);
      ctx.lineTo(cx + 50, cy + 30);
      ctx.lineTo(cx + 45, cy - 50);
      ctx.lineTo(cx - 45, cy - 50);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = fireColor;
      ctx.beginPath();
      ctx.arc(cx, cy, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = glowColor;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(cx - 15, cy + 5, 10, 0, Math.PI * 2);
      ctx.arc(cx + 12, cy - 8, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawShape(ctx, width, height, shapeType, stepIndex, totalSteps) {
      var cx = width / 2;
      var cy = height * 0.55;
      ctx.fillStyle = '#2d251f';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#3d3228';
      ctx.fillRect(0, height * 0.7, width, height * 0.3);

      var baseColor = '#5c4a3a';
      var lightColor = '#7b6a5a';

      if (shapeType === 'cup') {
        if (stepIndex === 0) {

        card.onclick = (function(k) {
          return function() { openDetail(k); };
        })(kiln);
        
        var stepsHtml = '';
        for (var j = 0; j < kiln.steps.length; j++) {
          var step = kiln.steps[j];
          stepsHtml += '<div class="step-card"><div class="step-canvas"><canvas id="grid-canvas-' + kiln.id + '-' + j + '"></canvas></div><div class="step-info"><div class="step-num">第' + (j + 1) + '步</div><div class="step-name">' + step.name + '</div></div></div>';
        }
        
        card.innerHTML = '<div class="kiln-header"><div class="kiln-title"><h3>' + kiln.name + '</h3><div class="sub-name">' + kiln.subName + '</div><div class="desc">' + kiln.desc + '</div></div><div class="kiln-difficulty">' + kiln.difficulty + '</div></div><div class="steps-grid">' + stepsHtml + '</div>';
        container.appendChild(card);
      }
      
      setTimeout(function() {
        for (var k = 0; k < KILNS.length; k++) {
          var kn = KILNS[k];
          for (var m = 0; m < kn.steps.length; m++) {
            var canvas = document.getElementById('grid-canvas-' + kn.id + '-' + m);
            if (canvas) {
              var ctx = canvas.getContext('2d');
              var rect = canvas.getBoundingClientRect();
              canvas.width = rect.width * 2;
              canvas.height = rect.height * 2;
              ctx.scale(2, 2);
              drawShape(ctx, rect.width, rect.height, shapeMap[kn.id], m, kn.steps.length);
            }
          }
        }
      }, 300);
    }

      titleEl.textContent = kiln.name;
